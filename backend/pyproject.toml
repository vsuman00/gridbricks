[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "gridbricks-backend"
version = "0.1.0"
description = "Local wind forecast replay API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.18.4",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "sqlalchemy==2.0.48",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gridbricks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gridbricks"]
